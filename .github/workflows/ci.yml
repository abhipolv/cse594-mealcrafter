name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mealcrafter
          POSTGRES_PASSWORD: mealcrafter
          POSTGRES_DB: mealcrafter
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U mealcrafter"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://mealcrafter:mealcrafter@localhost:54329/mealcrafter
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      AI_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Migrations apply cleanly
        run: pnpm db:migrate
      - name: Schema and migrations agree
        run: pnpm db:generate && git diff --exit-code -- drizzle/ || (echo "::error::src/lib/db/schema.ts changed without a migration. Run pnpm db:generate and commit drizzle/." && exit 1)
      - name: Build
        run: pnpm build
      - name: Seed demo data
        run: pnpm db:seed
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end smoke test
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
