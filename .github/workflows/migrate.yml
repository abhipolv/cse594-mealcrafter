name: Migrate production database

# Applies new migrations to the Supabase database after a merge to main.
# Needs the repository secret PROD_DATABASE_URL (Supabase session pooler URL).
on:
  push:
    branches: [main]
    paths: ["drizzle/**"]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::warning::PROD_DATABASE_URL is not set; skipping."; exit 0; fi
          pnpm db:migrate
